[project]
name = "climate-hazard-api"
version = "0.1.0"
description = "Climate Hazard Trend Analyzer API (heatwaves)"
authors = [
    { name = "Akshit", email = "akshit07032001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.3",
    "scipy>=1.18.1",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
